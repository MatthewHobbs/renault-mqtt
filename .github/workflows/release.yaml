# Tags a release when __version__ changes on main, signing the tag with an SSH signing key.
#
# Triggered by CI completing rather than by the push itself, so a tag can only ever land on a
# commit that has actually validated - the release must never be published from an unvalidated
# SHA. github.event.workflow_run.head_sha is that exact commit.
#
# Idempotent: every successful CI run on main reaches this workflow, and it no-ops unless
# __version__ names a tag that does not exist yet. 0.13.0 and 0.13.1 shipped untagged because
# this was a manual step; the add-ons pin the core by SHA and Renovate now tracks it by tag, so
# a missed tag silently stops those bumps being offered.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Tag release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the tag and create the release; nothing else here writes.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The validated commit, not the branch head: main may have moved on since CI ran, and
          # tagging a newer, unvalidated commit is exactly what this gate exists to prevent.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version and check for an existing tag
        id: v
        run: |
          set -euo pipefail
          version="$(python3 -c "import renault_mqtt, sys; sys.stdout.write(renault_mqtt.__version__)")"
          case "$version" in
            "") echo "::error::__version__ is empty"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already tagged - nothing to do"
            echo "tag_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet"
            echo "tag_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.v.outputs.tag_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # Private half of a signing-only SSH key, registered on the account as a *signing*
          # key. Deliberately not the key used to push: this one can only vouch for tags.
          SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::TAG_SIGNING_KEY is not set - refusing to publish an unsigned tag."
            exit 1
          fi
          # umask before the file exists: mktemp is 600 already, but this keeps it so if the
          # runner image ever changes defaults. Removed on any exit path, including failure.
          umask 077
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$keyfile"
          # Tagger identity must be a verified email on the account owning the signing key,
          # or GitHub shows the tag as Unverified. This address is already public in every
          # commit in this repo.
          git config user.name "Matthew Hobbs"
          git config user.email "matt@matthobbs.net"
          git config gpg.format ssh
          git config user.signingkey "$keyfile"
          git tag -s "v$VERSION" "$SHA" -m "renault-mqtt v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --generate-notes --title "renault-mqtt v$VERSION"
