# Tags a release when __version__ changes on main, signing the tag with an SSH signing key.
#
# Triggered by CI completing rather than by the push itself, so a tag can only ever land on a
# commit that has actually validated - the release must never be published from an unvalidated
# SHA. github.event.workflow_run.head_sha is that exact commit.
#
# Idempotent: every successful CI run on main reaches this workflow, and it no-ops unless
# __version__ names a tag that does not exist yet. 0.13.0 and 0.13.1 shipped untagged because
# this was a manual step; the add-ons pin the core by SHA and Renovate now tracks it by tag, so
# a missed tag silently stops those bumps being offered.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual dry run only: proves the signing path without waiting for a version bump.
  # The tag job below is gated on workflow_run.conclusion, which is null here, so a
  # dispatch can never publish a real release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Tag release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the tag and create the release; nothing else here writes.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The validated commit, not the branch head: main may have moved on since CI ran, and
          # tagging a newer, unvalidated commit is exactly what this gate exists to prevent.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version and check for an existing tag
        id: v
        run: |
          set -euo pipefail
          version="$(python3 -c "import renault_mqtt, sys; sys.stdout.write(renault_mqtt.__version__)")"
          case "$version" in
            "") echo "::error::__version__ is empty"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already tagged - nothing to do"
            echo "tag_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet"
            echo "tag_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.v.outputs.tag_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # Private half of a signing-only SSH key, registered on the account as a *signing*
          # key. Deliberately not the key used to push: this one can only vouch for tags.
          SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::TAG_SIGNING_KEY is not set - refusing to publish an unsigned tag."
            exit 1
          fi
          # umask before the file exists: mktemp is 600 already, but this keeps it so if the
          # runner image ever changes defaults. Removed on any exit path, including failure.
          umask 077
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$keyfile"
          # Tagger identity must be a verified email on the account owning the signing key,
          # or GitHub shows the tag as Unverified. This address is already public in every
          # commit in this repo.
          git config user.name "Matthew Hobbs"
          git config user.email "matt@matthobbs.net"
          git config gpg.format ssh
          git config user.signingkey "$keyfile"
          git tag -s "v$VERSION" "$SHA" -m "renault-mqtt v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --generate-notes --title "renault-mqtt v$VERSION"

  verify-signing:
    name: Verify tag signing (dry run)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Sign a throwaway tag, confirm GitHub verifies it, then delete it
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
          REPO: ${{ github.repository }}
          TAG: signing-check-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::TAG_SIGNING_KEY is not set."
            exit 1
          fi
          umask 077
          keyfile="$(mktemp)"
          # Delete the remote tag on every exit path, so a failure midway cannot leave a
          # stray tag behind. Both are best-effort: the tag may not exist yet.
          cleanup() {
            git push --delete origin "$TAG" >/dev/null 2>&1 || true
            rm -f "$keyfile"
          }
          trap cleanup EXIT
          printf '%s\n' "$SIGNING_KEY" > "$keyfile"
          git config user.name "Matthew Hobbs"
          git config user.email "matt@matthobbs.net"
          git config gpg.format ssh
          git config user.signingkey "$keyfile"

          # Deliberately not a vX.Y.Z name: a non-semver tag cannot be mistaken for a
          # release by the add-ons' Renovate, which reads this repo with the semver
          # versioning scheme.
          git tag -s "$TAG" HEAD -m "signing check (dry run, deleted immediately)"
          git push origin "$TAG"

          tag_object="$(git rev-parse "$TAG")"
          verification="$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.verification')"
          echo "verification: $verification"
          verified="$(printf '%s' "$verification" | python3 -c 'import json,sys; print(json.load(sys.stdin)["verified"])')"
          reason="$(printf '%s' "$verification" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reason"])')"
          if [ "$verified" != "True" ]; then
            echo "::error::GitHub did not verify the signed tag (reason: $reason)."
            exit 1
          fi
          echo "Signed tag verified by GitHub (reason: $reason)."

